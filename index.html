<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon / app icons — see public/favicon.svg (source shape shared with src/components/layout/Logo.tsx) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3355dd" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unruly — parametric design playground</title>
    <meta
      name="description"
      content="Unruly is a free parametric design playground: generate SVG patterns and vector art, tune them live, evolve and remix with controlled randomness, compose posters and social graphics, then export or copy straight into Figma."
    />
    <link rel="canonical" href="https://unruly.design/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, iMessage, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unruly" />
    <meta property="og:title" content="Unruly — parametric design playground" />
    <meta
      property="og:description"
      content="Play with shapes, patterns, color and randomness. Create editable vector designs and take them straight to Figma."
    />
    <meta property="og:image" content="https://unruly.design/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Unruly — a parametric design playground. Make something unexpected." />
    <meta property="og:url" content="https://unruly.design/" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unruly — parametric design playground" />
    <meta
      name="twitter:description"
      content="Play with shapes, patterns, color and randomness. Create editable vector designs and take them straight to Figma."
    />
    <meta name="twitter:image" content="https://unruly.design/og-image.png" />
    <meta name="twitter:image:alt" content="Unruly — a parametric design playground. Make something unexpected." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
